[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-classroom"
version = "0.1.0"
description = "CPU image and video head-direction baseline for instructor review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mediapipe==0.10.32", "numpy==2.2.6", "opencv-contrib-python==4.11.0.86"]

[tool.setuptools.packages.find]
where = ["src"]
