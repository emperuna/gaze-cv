name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Check repository consistency
        run: python .github/automation.py check
      - name: Test workflow behavior
        run: python -m unittest discover -s .github/tests -v
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test application behavior without downloaded assets
        run: python -m unittest discover -s tests -v
      - name: Check commit whitespace
        run: |
          EMPTY_TREE=$(git hash-object -t tree --stdin </dev/null)
          git diff --check "$EMPTY_TREE" HEAD
