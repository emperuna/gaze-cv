name: Auto PR

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute only the default branch's trusted helper, not pushed PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - name: Open or reuse the branch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/automation.py ]; then
            python .github/automation.py open-pr
          else
            echo "Bootstrap: merge the automation setup PR before automatic PR creation is available."
          fi
